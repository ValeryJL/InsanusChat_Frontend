[package]
name = "insanus-harnes"
version = "1.5.0"
description = "insanus-harnes — Desktop App (Windows & Linux) con Microservicio Local VS Code y Control Remoto estilo Antigravity"
authors = ["Valeria Jauregui Lorda"]
edition = "2021"

[lib]
name = "insanus_harnes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
